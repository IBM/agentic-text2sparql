[project]
name = "agentic-text2sparql-skills"
version = "0.1.0"
description = "A set of skills for performing text-to-SPARQL over Wikidata with entity search, graph exploration, query generation, and execution"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
